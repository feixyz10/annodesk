[project]
name = "annodesk"
version = "0.3.1"
description = "A local-first image annotation tool for bounding boxes and instance masks, with SAM-powered interactive segmentation and YOLO-assisted detection."
readme = "docs/user-guide.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "tyro>=0.9,<2",
  "pydantic>=2.10,<3",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "pyyaml>=6,<7",
  "platformdirs>=4,<5",
  "pycocotools>=2.0.8,<3",
  "loguru>=0.7,<1",
  "filelock>=3.16,<4",
  "ultralytics>=8.3,<9",
]

[project.scripts]
annodesk = "annodesk.cli:main"

[dependency-groups]
dev = ["ruff>=0.11,<1", "pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annodesk"]

[tool.hatch.build.targets.wheel.force-include]
"models.json" = "annodesk/models.json"
"assets/models" = "annodesk/assets/models"
"docs/user-guide.md" = "annodesk/docs/user-guide.md"
"docs/user-guide-cn.md" = "annodesk/docs/user-guide-cn.md"

[tool.hatch.build.targets.sdist]
include = ["src/", "frontend/", "tests/", "docs/specs/", "docs/validation/", "docs/releases/", "docs/user-guide.md", "docs/user-guide-cn.md", "pyproject.toml", "README.md", "AGENTS.md", "uv.lock", "models.json", "assets/models/", "LICENSE"]
exclude = ["frontend/node_modules"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
