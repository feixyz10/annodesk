[project]
name = "annodesk"
version = "0.1.0"
description = "A local-first image annotation workbench for boxes and masks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "tyro>=0.9,<2",
  "pydantic>=2.10,<3", "pillow>=11,<13", "numpy>=2,<3",
  "pyyaml>=6,<7", "platformdirs>=4,<5", "pycocotools>=2.0.8,<3",
]

[project.optional-dependencies]
inference = ["ultralytics>=8.3,<9"]

[project.scripts]
annodesk = "annodesk.cli:main"

[dependency-groups]
dev = ["ruff>=0.11,<1", "pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annodesk"]

[tool.hatch.build.targets.sdist]
include = ["src/", "frontend/", "tests/", "docs/specs/", "pyproject.toml", "README.md", "uv.lock"]
exclude = ["frontend/node_modules"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
